name: Deploy Pages

on:
  push:
    branches: [master]
    paths-ignore:
      - "worker/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Cloudflare Pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # 固定英文提交信息：默认取 git 提交信息，中文可能被 Pages 接口拒绝（本地脚本同样处理）
          command: pages deploy dist --project-name=draw-guess --commit-message=ci-deploy
